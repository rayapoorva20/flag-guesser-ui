worker_processes  1;

events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      try_files $uri =404;
    }

    location /api/ {
      proxy_pass https://flag-guesser-microservice.fly.dev/;  # trailing / strips /api
      proxy_http_version 1.1;

      proxy_ssl_server_name on;                         # <-- needed for HTTPS upstream
      proxy_set_header Host flag-guesser-microservice.fly.dev;  # <-- SNI host

      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 60s;
    }

    location /auth/ {
      proxy_pass https://flag-guesser-auth.fly.dev/;   # trailing slash strips /auth prefix -> /foo
      proxy_http_version 1.1;
      proxy_ssl_server_name on;
      proxy_set_header Host flag-guesser-auth.fly.dev;

      # forward client identity / auth header
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;

      # websockets / upgrade safe (optional)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }

      proxy_read_timeout 60s;
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
